<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDO Ping Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="logo-text">BDO Ping Monitor</h1>
          <p class="logo-sub">Server Latency Monitor</p>
        </div>
      </div>
      <div class="status-badge" id="global-status">
        <span class="status-dot status-online"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <main class="server-list" id="server-list">
      <!-- Main Server (Injected by JS) -->
      <div class="server-card skeleton" id="card-main">
        <div class="server-header">
            <div class="server-name-wrap">
                <span class="server-name" id="main-name">-</span>
                <span class="region-tag">Main</span>
            </div>
            <div class="ip-address" id="main-ip">-</div>
        </div>
        <div class="server-body">
            <div class="ping-display">
                <div class="ping-value" id="ping-main">-</div>
            </div>
            <div class="server-status">
                <div class="status-dot status-checking" id="dot-main"></div>
                <span class="status-text-server" id="status-text-main">Waiting</span>
            </div>
        </div>
        <div class="history-chart">
            <canvas id="chart-main"></canvas>
        </div>
      </div>

      <!-- Secondary Server (Injected by JS) -->
      <div class="server-card skeleton" id="card-secondary" style="display: none;">
        <div class="server-header">
            <div class="server-name-wrap">
                <select class="server-selector" id="secondary-selector" onchange="onSecondaryServerChange()">
                </select>
                <span class="region-tag">Sub</span>
            </div>
            <div class="ip-address" id="secondary-ip">-</div>
        </div>
        <div class="server-body">
            <div class="ping-display">
                <div class="ping-value" id="ping-secondary">-</div>
            </div>
            <div class="server-status">
                <div class="status-dot status-checking" id="dot-secondary"></div>
                <span class="status-text-server" id="status-text-secondary">Waiting</span>
            </div>
        </div>
        <div class="history-chart">
            <canvas id="chart-secondary"></canvas>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-info">
        <span id="last-update">Initializing...</span>
      </div>
      <div class="footer-actions">
        <button class="btn-refresh" id="btn-refresh" onclick="manualPing()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Refresh
        </button>
      </div>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
